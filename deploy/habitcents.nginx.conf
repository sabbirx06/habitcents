server {
    listen 80;
    server_name habitcents.duckdns.org;
    location /.well-known/acme-challenge/ { root /var/www/habitcents-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name habitcents.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/habitcents.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habitcents.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
